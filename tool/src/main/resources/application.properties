spring.application.name=tool

# Ollama
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.chat.options.model=${OLLAMA_MODEL:qwen2.5:3b}

# Comma-separated trusted public HTTPS hostnames the agent may contact.
agent.url-check.allowed-hosts=${URL_CHECK_ALLOWED_HOSTS:example.com,httpbin.org}

# Per-request limits, including queue wait and all model/tool rounds.
agent.execution.max-model-calls=${AGENT_MAX_MODEL_CALLS:6}
agent.execution.max-tool-calls=${AGENT_MAX_TOOL_CALLS:5}
agent.execution.timeout-ms=${AGENT_TIMEOUT_MS:30000}

# OpenAI is opt-in, so the default Ollama service never requires a cloud key.
agent.provider=ollama
spring.ai.openai.api-key=${OPENAI_API_KEY:}
spring.ai.openai.chat.enabled=false
spring.ai.openai.embedding.enabled=false
spring.ai.openai.image.enabled=false
spring.ai.openai.audio.speech.enabled=false
spring.ai.openai.audio.transcription.enabled=false
spring.ai.ollama.embedding.enabled=false
spring.autoconfigure.exclude=org.springframework.ai.autoconfigure.openai.OpenAiAutoConfiguration
